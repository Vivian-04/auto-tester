# Example workflow for the repo under test (e.g. Zedu web): runs Playwright
# smoke tests and posts the results to Auto Tester. Copy into the target repo's
# .github/workflows/ after the leads approve (PRD FR-13).
name: Auto Tester smoke run

on:
  workflow_dispatch: # FR-9: manual "Run now"
  schedule:
    - cron: "0 2 * * *" # FR-10: nightly
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  autotester:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@<pin-to-a-commit-SHA>

      - uses: actions/setup-node@<pin-to-a-commit-SHA>
        with:
          node-version: 22
          cache: npm

      # Supply-chain rule: committed lockfile, no install scripts (PRD §5).
      - run: npm ci --ignore-scripts

      - run: npx playwright install --with-deps chromium

      - name: Run smoke tests (JUnit report)
        run: npx playwright test --project=chromium --reporter=junit
        env:
          BASE_URL: ${{ vars.AUTOTESTER_STAGING_URL }}
          # Test accounts come from GitHub environment secrets only:
          USER_A_EMAIL: ${{ secrets.AUTOTESTER_USER_A_EMAIL }}
          USER_A_PASSWORD: ${{ secrets.AUTOTESTER_USER_A_PASSWORD }}
          USER_B_EMAIL: ${{ secrets.AUTOTESTER_USER_B_EMAIL }}
          USER_B_PASSWORD: ${{ secrets.AUTOTESTER_USER_B_PASSWORD }}

      - name: Upload failure evidence
        if: always()
        run: |
          mkdir -p evidence
          if [ -f test-results/*/failure.png ]; then
            i=0
            for f in test-results/*/failure.png; do
              mv "$f" "evidence/failure-$i.png"; i=$((i+1))
            done
          fi

      # Converts the JUnit report to the Auto Tester JSON payload and POSTs it.
      # A ready-made converter can live in this repo's examples/ folder.
      - name: Post results to Auto Tester
        if: always()
        run: node examples/post-results.mjs
        env:
          AUTOTESTER_API_URL: ${{ vars.AUTOTESTER_API_URL }} # e.g. https://tester.zedu.chat
          AUTOTESTER_API_KEY: ${{ secrets.AUTOTESTER_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
